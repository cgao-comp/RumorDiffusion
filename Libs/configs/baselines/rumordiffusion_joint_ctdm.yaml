name: rumordiffusion_joint_ctdm
model: {}
rumordiffusion_overrides:
  checkpoint:
    ctdm_subdir: rumordiffusion_ctdm_sota_joint_ctdm
  arbiter:
    freeze_ctdm: false
    prototype_residual:
      enabled: true
      temperature: 0.07
      momentum: 0.95
      logit_weight: 0.20
      min_count: 1
training:
  joint_finetuning:
    enabled: true
    arbiter_lr: 0.0002
    ctdm_lr: 0.00003
    weight_decay: 0.0001
    ctdm_unfreeze_last_layers: 1
    trainable_heads:
      - film
      - readout
      - full_to_latent
      - eps_x
      - edge_q
      - edge_k
      - time_embed
      - class_embed
      - text_proj
      - text_fusion_layer
      - gated_text_fusion
      - multiscale_proj
      - forecast_head
