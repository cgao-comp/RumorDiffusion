base_config: exp_canonical.yaml
experiment:
  seeds: [41, 42, 43]
  bootstrap_seed: 42
split:
  seed: 42
dataset:
  prefix:
    strategy: minutes
    unit: minutes
    window: 60
    window_overrides:
      twitter15: 60
      twitter16: 60
      weibo: 3
      pheme: 3
    unit_overrides:
      weibo: hop
      pheme: hop
  observability:
    seed: 42
    drop_node: 0.0
    drop_edge: 0.0
outputs:
  canonical:
    enabled: true
    root: ${DPLUS_OUTPUT_ROOT}
    protocol_id: rumordiffusion_canonical_v1
